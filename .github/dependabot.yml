version: 2
updates:
  # Python dependencies (pyproject.toml / uv.lock). requirements.txt is
  # exported from the lock: run `mise run export-requirements` on the PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
