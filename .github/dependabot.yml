version: 2
updates:
  # Python dependencies (pyproject.toml / uv.lock). requirements.txt is
  # exported from the lock: run `mise run export-requirements` on the PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Python minor upgrades move runtime.txt, mise.toml and requires-python
    # together; patch releases of the base image are fine.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
