name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # Tool versions come from mise.toml, same as local development.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.11.8
      - run: mise run lint

  test:
    # Pinned: Playwright 1.48's `install-deps` knows this Ubuntu release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.11.8
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # OS libraries Chromium needs; the browser itself is installed (and
      # cached) by the e2e-setup task that `mise run cov` depends on.
      - run: mise exec -- uv sync --locked && mise exec -- uv run playwright install-deps chromium
      - run: mise run cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: test-results/
