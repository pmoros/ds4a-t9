name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # Tool versions come from mise.toml, same as local development.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.11.8
      - run: mise run lint

  test:
    # Pinned: Playwright 1.48's `install-deps` knows this Ubuntu release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: 2026.11.8
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # OS libraries Chromium needs; the browser itself is installed (and
      # cached) by the e2e-setup task that `mise run cov` depends on.
      - run: mise exec -- uv sync --locked && mise exec -- uv run playwright install-deps chromium
      - run: mise run cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: test-results/

  docker:
    # The production image: builds, passes `pip check`, runs as non-root on a
    # custom PORT and serves the app.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ds4a-t9:ci .
      - name: Run the container and wait for it to serve
        run: |
          docker run -d --name app -e PORT=9090 -p 9090:9090 ds4a-t9:ci
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:9090/; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then
              echo "container exited during startup"; exit 1
            fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:9090/
          curl -fsS -o /dev/null http://127.0.0.1:9090/_dash-layout
          if [ "$(docker exec app id -u)" = "0" ]; then echo "runs as root"; exit 1; fi
          if docker exec app test -e /app/.venv; then echo ".venv leaked into the image"; exit 1; fi
      - if: always()
        run: docker logs app || true
