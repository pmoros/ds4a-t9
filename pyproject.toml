[project]
name = "idt-dashboard"
version = "0.1.0"
description = "DS4A Team 9 - IDT Bogotá tourism dashboard (Dash)"
readme = "README.md"
# Same interpreter as production (runtime.txt / Dockerfile).
requires-python = ">=3.13,<3.14"
# Direct dependencies only; uv.lock pins everything, and requirements.txt (used
# by the Docker image) is exported from it: `mise run export-requirements`.
dependencies = [
    "dash[compress]==4.5.1",
    "dash-bootstrap-components==2.0.4",
    "plotly==7.1.0",
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "gunicorn==27.0.1",
    "numpy==2.5.5",
    "openpyxl==3.1.5",
    "pandas==3.1.1",
]

[dependency-groups]
# Test dependencies must live in the project venv (they import the app).
# Standalone CLIs (ruff, pre-commit) are managed by mise, see mise.toml.
dev = [
    "playwright==1.65.2",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-playwright==0.10.0",
    "syrupy==7.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Dash ships a pytest plugin (dash.testing) this suite does not use.
addopts = "-ra --strict-markers -p no:dash"
markers = [
    "e2e: end-to-end browser tests (Playwright); deselect with -m 'not e2e'",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# Long lines are left to the formatter; the ones it can't wrap are strings
# (copy text, URLs) that read better whole. printf-style formatting is kept
# where it is clearer than f-strings (e.g. JavaScript templates full of braces).
ignore = ["E501", "UP031"]
