[project]
name = "idt-dashboard"
version = "0.1.0"
description = "DS4A Team 9 - IDT Bogotá tourism dashboard (Dash)"
readme = "README.md"
# Same interpreter as production (runtime.txt / Dockerfile).
requires-python = ">=3.13,<3.14"
# Direct dependencies only; uv.lock pins everything, and requirements.txt (used
# by the Docker image) is exported from it: `mise run export-requirements`.
dependencies = [
    # Dash 2.18 is the newest release that still loads dash-bootstrap-components
    # 0.13 (Bootstrap 4), so the UI looks exactly the same. Dash 4 + Bootstrap 5
    # is a separate, visible change.
    "dash[compress]==4.5.0",
    "dash-bootstrap-components==2.0.4",
    # Dash 2.18 serves plotly.js from plotly.py; 5.24 ships plotly.js 2.35.
    "plotly==7.1.0",
    "Flask==3.0.3",
    "Werkzeug==3.0.6",
    "gunicorn==27.0.1",
    "numpy==2.5.5",
    "openpyxl==3.1.5",
    "pandas==3.1.1",
]

[dependency-groups]
# Test dependencies must live in the project venv (they import the app).
# Standalone CLIs (ruff, pre-commit) are managed by mise, see mise.toml.
dev = [
    "playwright==1.65.2",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-playwright==0.10.0",
    "syrupy==7.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Dash ships a pytest plugin (dash.testing) this suite does not use.
addopts = "-ra --strict-markers -p no:dash"
markers = [
    "e2e: end-to-end browser tests (Playwright); deselect with -m 'not e2e'",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "Temp.py"]

[tool.ruff]
target-version = "py313"
line-length = 100
# Temp.py is unused scratch code with undefined names; it is removed in a later PR.
extend-exclude = ["Temp.py"]

[tool.ruff.lint]
# Deliberately narrow for the legacy modules: only rules that catch real bugs
# (syntax errors, undefined names, invalid comparisons). The rule set grows as
# modules are refactored.
select = ["E9", "F63", "F7", "F82"]
